server {
  listen 8086;
  server_name pogeu.com www.pogeu.com;
  root /usr/share/nginx/pogeu-sites/pogeu;
  index index.html;

  location /assets/ {
    alias /usr/share/nginx/pogeu-sites/assets/;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8087;
  server_name docs.pogeu.com;
  root /usr/share/nginx/pogeu-sites/docs;
  index index.html;

  location /assets/ {
    alias /usr/share/nginx/pogeu-sites/assets/;
    expires 1h;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 8086;
  server_name resistor-lens.pogeu.com;
  root /usr/share/nginx/pogeu-sites/resistor-lens;
  index index.html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://192.168.1.57:8091;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
