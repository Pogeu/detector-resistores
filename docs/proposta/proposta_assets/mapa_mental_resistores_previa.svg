<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1950" viewBox="0 0 3200 1950" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Mapa mental da metodologia de detecção de resistores</title>
  <desc id="descricao">Seis ramos partem do tema central: dados, pré-processamento, localização, leitura das faixas, validação e resultado. Cada ramo possui caixas próprias para seus elementos. A comparação de cores se desdobra em RGB, HSV e CIELAB.</desc>
  <style>
    .title { font: 700 66px Arial, Helvetica, sans-serif; fill: #181818; }
    .subtitle { font: 400 40px Arial, Helvetica, sans-serif; fill: #575757; }
    .line { fill: none; stroke: #999; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .root { fill: #eeeeec; stroke: #202020; stroke-width: 5; }
    .major { fill: #fff; stroke: #353535; stroke-width: 4; }
    .leaf { fill: #fff; stroke: #8c8c8c; stroke-width: 3; }
    .minor { fill: #f7f7f6; stroke: #8c8c8c; stroke-width: 3; }
    .root-text { font: 700 48px Arial, Helvetica, sans-serif; fill: #181818; text-anchor: middle; dominant-baseline: middle; }
    .root-small { font: 400 36px Arial, Helvetica, sans-serif; fill: #303030; text-anchor: middle; dominant-baseline: middle; }
    .major-text { font: 700 47px Arial, Helvetica, sans-serif; fill: #181818; text-anchor: middle; dominant-baseline: middle; }
    .leaf-text { font: 400 50px Arial, Helvetica, sans-serif; fill: #181818; text-anchor: middle; dominant-baseline: middle; }
    .small-text { font: 400 44px Arial, Helvetica, sans-serif; fill: #181818; text-anchor: middle; dominant-baseline: middle; }
  </style>

