[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-resistores"
version = "0.1.0"
description = "Detecção, contagem e identificação de valores de resistores em imagens e vídeos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cnn = ["torch>=2.0", "torchvision>=0.15", "Pillow>=9.0"]
detector = ["ultralytics>=8.0", "PyYAML>=6.0"]
legacy = ["pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.2.1", "joblib>=1.2"]

[project.scripts]
resistor-detector = "resistor_detector.cli:main"
resistor-benchmark = "resistor_detector.benchmark:main"
resistor-caoile-cnn = "resistor_detector.caoile_cnn:main"
resistor-band-decoder = "resistor_detector.band_decoder:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
